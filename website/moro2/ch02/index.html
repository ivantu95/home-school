<script>
'use strict';
const CHAPTER = { number: 2, title: 'Десятки. Числа до 100', minutes: 9, language: 'ru', next: '../ch03/' };

/* ---------- chapter drawing helpers ---------- */
const text = (p, str, x, y, t0, { size = 30, fill = COL.chalk, anchor = 'start', weight = 500 } = {}) => { const e = T(p, str, { x, y, size, fill, anchor, weight, o: 0 }); show(e, t0); return e; };
const mline = (p, str, x, y, t0, fill = COL.chalk, size = 56, anchor = 'middle') => { const e = M(p, [str], { x, y, size, fill, anchor, o: 0 }); show(e, t0); return e; };
// Colours of this chapter: a ten (a bundle, the tens digit) is blue, a single unit (a loose stick, the units digit) is orange.
const C02_TEN = COL.whole, C02_ONE = COL.task;
// One loose stick: centred on x, top at y, height h. The group carries the fill so it can be recoloured (c_fill).
function c02_stick(p, x, y, colr = C02_ONE, h = 120) {
  const g = G(p, { x, y, o: 0 });
  g.setAttribute('fill', colr);
  mk('rect', { x: -5, y: 0, width: 10, height: h, rx: 5, stroke: COL.board, 'stroke-width': 1.5 }, g);
  return g;
}
// The rope around a bundle (centred on x, at height y).
function c02_rope(p, x, y) {
  const g = G(p, { o: 0 });
  path(g, `M${x - 47} ${y}H${x + 47}`, { stroke: COL.board, 'stroke-width': 8 });
  path(g, `M${x - 47} ${y}H${x + 47}M${x + 40} ${y}l14 -8M${x + 40} ${y}l14 8`, { stroke: COL.chalk, 'stroke-width': 2.5 });
  return g;
}
// A bundle of ten sticks tied with a rope: the same ten sticks at a step of 8 px, centred on x, top at y.
const C02_DX = i => -36 + i * 8;
function c02_bundle(p, x, y, colr = C02_TEN, h = 120) {
  const g = G(p, { x, y, o: 0 });
  g.setAttribute('fill', colr);
  for (let i = 0; i < 10; i++) mk('rect', { x: C02_DX(i) - 5, y: 0, width: 10, height: h, rx: 5, stroke: COL.board, 'stroke-width': 1.5 }, g);
  const r = c02_rope(g, 0, h / 2); put(r, { o: 1 });
  return g;
}
// A two-digit number with the tens digit blue and the units digit orange; the digits meet at x.
function c02_num(p, n, x, y, t0, size = 110) {
  const g = G(p, { o: 0 });
  T(g, String(Math.floor(n / 10)), { x, y, size, fill: C02_TEN, font: MATH, weight: 600, anchor: 'end' });
  T(g, String(n % 10), { x, y, size, fill: C02_ONE, font: MATH, weight: 600, anchor: 'start' });
  show(g, t0);
  return g;
}
// A counter whose text changes at given times: steps = [[t, '21'], ...].
function c02_counter(p, x, y, first, t0, steps, size = 120) {
  const e = T(p, first, { x, y, size, fill: COL.chalk, font: MATH, weight: 600, anchor: 'middle', o: 0 });
  show(e, t0);
  steps.forEach(([t, s]) => { prog(q => { if (q >= 1) e.textContent = s; }, t, .01, lin); pulse(e, t, 1.12); });
  return e;
}

/* ---------- beats ---------- */
const BEATS = [
  ['intro', 'Десятки. Числа до 100', (m, D) => {
    const g = G(scene, { o: 0, y: 24 });
    T(g, 'Раздел 1 · Глава 2', { x: 800, y: 330, size: 28, fill: COL.dim, anchor: 'middle' });
    T(g, 'Десятки. Числа до 100', { x: 800, y: 440, size: 88, weight: 600, anchor: 'middle' });
    tw(g, { o: 1, y: 0 }, .2, 1.1, out);
    const r = text(scene, 'считаем десятками и собираем числа из десятков и единиц', 800, 600, m('sub'), { size: 34, fill: COL.dim, anchor: 'middle' });
    tw(g, { o: 0, y: -24 }, D - .9, .8); hide(r, D - .9, .8);
  }],

  ['ten', 'Десяток', (m) => {
    const p = panel(0);
    const H = 150, y = 200, cx = 800;
    const sticks = [];
    for (let i = 0; i < 10; i++) {
      const s = c02_stick(p, 350 + i * 100, y, C02_ONE, H);
      show(s, i ? m('s' + (i + 1)) : .3, .3);
      const n = T(p, String(i + 1), { x: 350 + i * 100, y: y + H + 50, size: 34, fill: C02_ONE, weight: 700, anchor: 'middle', o: 0 });
      show(n, i ? m('s' + (i + 1)) : m('s1'), .3);
      hide(n, m('tie'), .4);
      if (!i) pulse(s, m('s1'), 1.15);
      sticks.push(s);
    }
    sticks.forEach((s, i) => tw(s, { x: cx + C02_DX(i) }, m('tie', .2), .9, io));
    const rope = c02_rope(p, cx, y + H / 2);
    show(rope, m('tie', 1.2), .4);
    sticks.forEach(s => tw(s, { c_fill: C02_TEN }, m('name'), .6));
    text(p, '1 десяток', cx, y + H + 60, m('name', .2), { size: 40, fill: C02_TEN, anchor: 'middle', weight: 700 });
    mline(p, '1 дес. = 10 ед.', 800, 640, m('rule'), COL.chalk, 76);
    draw(path(p, 'M540 668H1060', { stroke: C02_TEN, 'stroke-width': 4 }, { d: 0 }), m('rule', .6), .6);
  }],

  ['tens', 'Счёт десятками', (m) => {
    const p = panel(0);
    const xs = i => 170 + i * 140;
    for (let i = 0; i < 10; i++) {
      const b = c02_bundle(p, xs(i), 150);
      put(b, { y: 120 });
      tw(b, { o: 1, y: 150 }, i ? m('t' + (i + 1)) : .3, .45, out);
      const n = T(p, String((i + 1) * 10), { x: xs(i), y: 335, size: 40, fill: COL.chalk, font: MATH, weight: 700, anchor: 'middle', o: 0 });
      put(n, { s: .4 }); pop(n, m('t' + (i + 1), .2));
      text(p, `${i + 1} дес.`, xs(i), 375, m('t' + (i + 1), .3), { size: 22, fill: COL.dim, anchor: 'middle' });
    }
    uBracket(p, 100, 1500, 410, '10 дес. = 100 = 1 сотня', COL.good, m('hund'), { size: 40 });
    [3, 8, 9].forEach((i, k) => {
      const c = mk('rect', { x: xs(i) - 50, y: 296, width: 100, height: 52, rx: 26, fill: 'none', stroke: COL.task, 'stroke-width': 4 }, p);
      put(c, { o: 0 }); show(c, m('odd', .4 + k * .5), .3);
    });
    [['40', 'сорок'], ['90', 'девяносто'], ['100', 'сто']].forEach(([n, w], k) => {
      mline(p, n, 360 + k * 420, 640, m('odd', .4 + k * .5), COL.chalk, 52, 'end');
      text(p, `— ${w}`, 380 + k * 420, 638, m('odd', .4 + k * .5), { size: 40, fill: COL.task, weight: 600 });
    });
  }],

  ['calc', 'Десятки как единицы', (m) => {
    const p = panel(0);
    text(p, 'Десятки считают так же, как единицы', 800, 90, .2, { size: 36, anchor: 'middle', weight: 600 });
    // 3 tens + 1 ten
    for (let i = 0; i < 3; i++) { const b = c02_bundle(p, 160 + i * 115, 140); show(b, m('a'), .4); }
    const add = c02_bundle(p, 160 + 3 * 115, 140);
    put(add, { x: 160 + 3 * 115 + 140 }); tw(add, { o: 1, x: 160 + 3 * 115 }, m('a2'), .7, out);
    pulse(add, m('a2', .8), 1.08);
    mline(p, '3 дес. + 1 дес. = 4 дес.', 1150, 190, m('a3'), COL.chalk, 48);
    mline(p, '30 + 10 = 40', 1150, 270, m('a4'), C02_TEN, 56);
    text(p, 'как 3 + 1 = 4', 1150, 320, m('a4', .8), { size: 26, fill: COL.dim, anchor: 'middle' });
    draw(path(p, 'M100 370H1500', { stroke: COL.faint, 'stroke-width': 2, 'stroke-dasharray': '6 10' }, { d: 0 }), m('b', -.4), .6);
    // 5 tens − 2 tens
    const five = [];
    for (let i = 0; i < 5; i++) { const b = c02_bundle(p, 160 + i * 115, 420); show(b, m('b'), .4); five.push(b); }
    five.slice(3).forEach(b => tw(b, { x: st(b).x + 180, o: .18 }, m('b2'), .8));
    mline(p, '5 дес. − 2 дес. = 3 дес.', 1150, 470, m('b3'), COL.chalk, 48);
    mline(p, '50 − 20 = 30', 1150, 550, m('b3', 1.6), C02_TEN, 56);
    text(p, 'как 5 − 2 = 3', 1150, 600, m('b3', 2.4), { size: 26, fill: COL.dim, anchor: 'middle' });
  }],

  ['q1', 'Проверь себя', () => {
    const p = panel(0);
    text(p, 'Помни:', 120, 220, .2, { size: 30, fill: COL.dim });
    mline(p, '1 дес. = 10', 120, 300, .3, C02_TEN, 46, 'start');
    const b = c02_bundle(p, 230, 360); show(b, .4, .4);
  }, { ask: done => quiz({ x: 560, y: 90, w: 960, cls: 'side' }, [{
    id: 'c-tens', prompt: ['Посчитай десятками и заполни окошки.'],
    build: blanks([
      { parts: ['4 дес. + 5 дес. = ', { box: '9' }, ' дес.'], why: 'Как 4 + 5 = 9: девять десятков.', hint: 'Считай десятки, как простые единицы: 4 + 5.' },
      { parts: ['40 + 50 = ', { box: '90' }, ''], why: '4 дес. + 5 дес. = 9 дес. — это 90.', hint: '40 — это 4 десятка, 50 — 5 десятков. Сколько всего десятков?' },
      { parts: ['90 − 40 = ', { box: '50' }, ''], why: '9 дес. − 4 дес. = 5 дес. — это 50.', hint: '90 — это 9 десятков. Убери 4 десятка.' },
      { parts: ['60 + 30 = ', { box: '90' }, ''], why: '6 дес. + 3 дес. = 9 дес. — это 90.', hint: 'Как 6 + 3, только десятками.' },
      { parts: ['100 = ', { box: '10' }, ' дес.'], why: 'Сто — это десять десятков, одна сотня.', hint: 'Вспомни, сколько пучков мы насчитали до ста.' },
    ]),
  }], done) }],

  ['build', 'Десятки и единицы', (m) => {
    const p = panel(0);
    const H = 150, y = 230;
    [300, 420].forEach(x => { const b = c02_bundle(p, x, y, C02_TEN, H); show(b, .3, .4); });
    const cnt = c02_counter(p, 1200, 380, '20', m('two'), [[m('u1', .3), '21'], [m('u2', .3), '22'], [m('u3', .3), '23']]);
    [560, 620, 680].forEach((x, i) => {
      const s = c02_stick(p, x, y, C02_ONE, H);
      put(s, { y: y - 40 }); tw(s, { o: 1, y }, m('u' + (i + 1)), .4, out);
    });
    uBracket(p, 250, 470, y + H + 30, '2 дес.', C02_TEN, m('split'), { size: 34 });
    uBracket(p, 540, 700, y + H + 30, '3 ед.', C02_ONE, m('split', .8), { size: 34 });
    mline(p, '2 дес. 3 ед. = 23', 800, 680, m('split', 1.6), COL.chalk, 60);
    hide(cnt, m('write'), .3);
    c02_num(p, 23, 1200, 380, m('write'), 120);
    text(p, 'десятки', 1185, 440, m('write', .4), { size: 30, fill: C02_TEN, anchor: 'end', weight: 600 });
    text(p, 'единицы', 1215, 440, m('units'), { size: 30, fill: C02_ONE, anchor: 'start', weight: 600 });
  }],

  ['q2', 'Проверь себя', () => {
    const p = panel(0);
    const y = 110;
    const L = [c02_bundle(p, 300, y)];
    for (let i = 0; i < 4; i++) L.push(c02_stick(p, 400 + i * 40, y));
    L.forEach(e => show(e, .2, .4));
    const Rt = [];
    for (let i = 0; i < 4; i++) Rt.push(c02_bundle(p, 900 + i * 105, y));
    Rt.push(c02_stick(p, 1335, y));
    Rt.forEach(e => show(e, .3, .4));
    text(p, 'слева', 410, 280, .4, { size: 28, fill: COL.dim, anchor: 'middle' });
    text(p, 'справа', 1110, 280, .4, { size: 28, fill: COL.dim, anchor: 'middle' });
  }, { ask: done => quiz({ x: 200, y: 320, w: 1200, cls: 'side' }, [{
    id: 'c-sticks', prompt: ['Сколько палочек на каждом рисунке? Сколько это десятков и единиц?'],
    build: blanks([
      { parts: ['Слева: ', { box: '1' }, ' дес. ', { box: '4' }, ' ед. — это ', { box: '14' }], why: 'Один пучок — десяток, и 4 палочки: 14.', hint: 'Пучок — это один десяток. Отдельные палочки — единицы.' },
      { parts: ['Справа: ', { box: '4' }, ' дес. ', { box: '1' }, ' ед. — это ', { box: '41' }], why: 'Четыре пучка — 40, и одна палочка: 41.', hint: 'Посчитай пучки десятками: 10, 20, 30, 40. И добавь одну палочку.' },
    ]),
  }], done) }],

  ['next', 'Новый десяток', (m) => {
    const p = panel(0);
    const H = 150, y = 230, bx = 460;
    [220, 340].forEach(x => { const b = c02_bundle(p, x, y, C02_TEN, H); show(b, .3, .4); });
    const cnt = c02_counter(p, 1300, 380, '29', .4, [[m('n30'), '30']]);
    const sticks = [];
    for (let i = 0; i < 10; i++) {
      const s = c02_stick(p, 480 + i * 60, y, C02_ONE, H);
      if (i < 9) show(s, .4, .4);
      else { put(s, { y: y - 50 }); tw(s, { o: 1, y }, m('add'), .5, out); pulse(s, m('add', .5), 1.1); }
      sticks.push(s);
    }
    hide(text(p, '2 дес. 9 ед.', 800, 160, m('n29', .5), { size: 30, fill: COL.dim, anchor: 'middle' }), m('n30'), .4);
    const box = mk('rect', { x: 445, y: y - 18, width: 610, height: H + 36, rx: 14, fill: 'none', stroke: C02_ONE, 'stroke-width': 3, 'stroke-dasharray': '10 8' }, p);
    put(box, { o: 0 }); show(box, m('ten'), .3); hide(box, m('tie', .2), .3);
    hide(text(p, '10 ед.', 750, y + H + 60, m('ten', .2), { size: 32, fill: C02_ONE, anchor: 'middle', weight: 700 }), m('tie', .2), .3);
    sticks.forEach((s, i) => tw(s, { x: bx + C02_DX(i) }, m('tie', .3), .9, io));
    show(c02_rope(p, bx, y + H / 2), m('tie', 1.3), .4);
    sticks.forEach(s => tw(s, { c_fill: C02_TEN }, m('n30'), .6));
    text(p, '3 дес.', 340, y + H + 60, m('n30', .3), { size: 32, fill: C02_TEN, anchor: 'middle', weight: 700 });
    void cnt;
    mline(p, '29 + 1 = 30', 800, 560, m('n30', .5), COL.chalk, 52);
    mline(p, '39 + 1 = 40', 800, 650, m('more'), COL.chalk, 52);
    mline(p, '99 + 1 = 100', 800, 740, m('last'), COL.good, 52);
  }],

  ['q3', 'Проверь себя', () => {
    const p = panel(0);
    text(p, 'Помни:', 120, 220, .2, { size: 30, fill: COL.dim });
    mline(p, '19 + 1 = 20', 120, 300, .3, COL.chalk, 46, 'start');
    mline(p, '29 + 1 = 30', 120, 380, .4, COL.chalk, 46, 'start');
  }, { ask: done => quiz({ x: 560, y: 120, w: 960, cls: 'side' }, [{
    id: 'c-next', prompt: ['Какое число пропущено? Каждое следующее число на 1 больше.'],
    build: blanks([
      { parts: ['38,  39,  ', { box: '40' }, ',  41,  42'], why: '39 + 1 = 40: девять единиц и ещё одна — новый десяток.', hint: 'Какое число идёт сразу после 39?' },
      { parts: ['87,  88,  89,  ', { box: '90' }, ',  91'], why: '89 + 1 = 90: получился девятый десяток.', hint: 'После 89 палочек добавь одну — свяжется новый пучок.' },
      { parts: ['96,  97,  98,  99,  ', { box: '100' }], why: '99 + 1 = 100: десять десятков — одна сотня.', hint: 'Что получится, если к 99 прибавить 1?' },
      { parts: ['59 + 1 = ', { box: '60' }], why: '5 дес. 9 ед. и ещё одна единица — это 6 дес., то есть 60.', hint: 'Девять единиц и одна — это новый десяток.' },
    ]),
  }], done) }],

  ['order', 'Место цифры', (m) => {
    const p = panel(0);
    c02_num(p, 51, 400, 190, .3, 110);
    c02_num(p, 15, 1200, 190, .4, 110);
    text(p, 'одни и те же цифры, а числа разные', 800, 75, m('same'), { size: 30, fill: COL.dim, anchor: 'middle' });
    const H = 90, y = 250;
    for (let i = 0; i < 5; i++) { const b = c02_bundle(p, 160 + i * 100, y, C02_TEN, H); show(b, m('a', i * .15), .4); }
    show(c02_stick(p, 690, y, C02_ONE, H), m('a', .9), .4);
    text(p, '5 дес. 1 ед.', 400, 390, m('a', 1), { size: 32, fill: COL.chalk, anchor: 'middle', weight: 600 });
    show(c02_bundle(p, 1030, y, C02_TEN, H), m('b'), .4);
    for (let i = 0; i < 5; i++) show(c02_stick(p, 1130 + i * 50, y, C02_ONE, H), m('b', .3 + i * .15), .4);
    text(p, '1 дес. 5 ед.', 1200, 390, m('b', 1), { size: 32, fill: COL.chalk, anchor: 'middle', weight: 600 });
    text(p, 'Важно, на каком месте стоит цифра.', 800, 470, m('rule'), { size: 34, fill: COL.task, anchor: 'middle', weight: 600 });
    draw(path(p, 'M100 520H1500', { stroke: COL.faint, 'stroke-width': 2, 'stroke-dasharray': '6 10' }, { d: 0 }), m('trap', -.4), .6);
    text(p, '«двадцать три»', 340, 640, m('trap'), { size: 44, anchor: 'middle', weight: 600 });
    mline(p, '203', 800, 645, m('wrong'), COL.bad, 72);
    draw(path(p, 'M720 650L880 600', { stroke: COL.bad, 'stroke-width': 6 }, { d: 0 }), m('wrong', 1.2), .4);
    text(p, 'лишний ноль', 800, 710, m('wrong', 1.6), { size: 26, fill: COL.bad, anchor: 'middle' });
    c02_num(p, 23, 1230, 650, m('right'), 90);
    text(p, '2 дес. 3 ед.', 1230, 720, m('right', .8), { size: 28, fill: COL.dim, anchor: 'middle' });
    const ok = path(p, 'M1330 610l18 20l36 -44', { stroke: COL.good, 'stroke-width': 6 }, { d: 0 });
    draw(ok, m('right', 1.6), .4);
  }],

  ['q4', 'Проверь себя', (m) => {
    const p = panel(0);
    text(p, '«сорок семь»', 800, 200, .3, { size: 56, anchor: 'middle', weight: 600 });
  }, { ask: done => quiz({ x: 300, y: 290, w: 1000, cls: 'side' }, [{
    id: 'c-write', prompt: ['Как записать цифрами число «сорок семь»?'],
    build: choice([['47'], ['407'], ['74']], 0,
      'Сорок — это 4 десятка, семь — 7 единиц. Сначала пишут десятки, потом единицы: 47.',
      [null, 'Ноль здесь лишний. Сорок семь — это 4 дес. 7 ед.: две цифры, 4 и 7.',
       '74 — это семьдесят четыре: 7 десятков. А в числе «сорок семь» 4 десятка — их пишут первыми.']),
  }], done) }],

  ['wrap', 'Главное', (m) => {
    const p = panel(0);
    text(p, 'Запомним главное', 200, 170, .2, { size: 40, fill: COL.dim, weight: 600 });
    [['1 дес. = 10 ед.', 'w1', true],
     ['Десятки считают так же, как единицы: 10, 20, 30 … 100.', 'w2', false],
     ['10 дес. = 100 = 1 сотня', 'w3', true],
     ['В записи числа сначала десятки, потом единицы: 23.', 'w4', false]].forEach(([str, mark, big], i) => {
      const g = G(p, { x: -16, y: 290 + i * 130, o: 0 });
      mk('circle', { cx: 200, cy: -12, r: 26, fill: COL.task }, g);
      T(g, String(i + 1), { x: 200, y: -1, size: 30, fill: COL.board, weight: 700, anchor: 'middle' });
      T(g, str, { x: 260, size: big ? 44 : 34, weight: 600, font: big ? MATH : UI });
      tw(g, { o: 1, x: 0 }, m(mark), .6);
    });
  }],

  ['final1', 'Итоговое задание', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-numbers', prompt: ['Заполни окошки.'],
    build: blanks([
      { parts: ['2 дес. 9 ед. = ', { box: '29' }], why: '2 десятка — 20, и 9 единиц: 29.', hint: 'Сначала пиши десятки, потом единицы.' },
      { parts: ['9 дес. 2 ед. = ', { box: '92' }], why: '9 десятков — 90, и 2 единицы: 92.', hint: 'Десятков 9 — первая цифра 9.' },
      { parts: ['5 дес. = ', { box: '50' }], why: 'Пять десятков — пятьдесят. Единиц нет, поэтому в конце 0.', hint: 'Считай десятками: 10, 20, 30, 40, 50.' },
      { parts: ['10 дес. = ', { box: '100' }], why: 'Десять десятков — это сто, одна сотня.', hint: 'Что получится после 9 десятков — 90?' },
      { parts: ['восемьдесят один — ', { box: '81' }], why: 'Восемьдесят — 8 десятков, один — 1 единица: 81.', hint: 'Восемьдесят — это 8 десятков.' },
