<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Числа от 1 до 20</title>
<link rel="stylesheet" href="../lib/engine.css">
<link rel="expect" href="#bar" blocking="render"><!-- hold the first frame until the player exists, so the page transition can run -->
</head>
<body>
<script src="../lib/engine.js"></script>
<script src="audio/ru/timings.js"></script>
<script src="../lib/units.js"></script>
<script>
'use strict';
const CHAPTER = { number: 1, title: 'Числа от 1 до 20', minutes: 6, language: 'ru', next: '../ch02/' };

/* ---------- chapter drawing helpers ---------- */
const text = (p, str, x, y, t0, { size = 30, fill = COL.chalk, anchor = 'start', weight = 500 } = {}) => { const e = T(p, str, { x, y, size, fill, anchor, weight, o: 0 }); show(e, t0); return e; };
const mline = (p, str, x, y, t0, fill = COL.chalk, size = 56, anchor = 'middle') => { const e = M(p, [str], { x, y, size, fill, anchor, o: 0 }); show(e, t0); return e; };
// One counting stick, its top-centre at (x, y). Returns a group that can slide along x.
const c01_stick = (p, x, y, h = 200) => {
  const g = G(p, { x, y, o: 0 });
  mk('rect', { x: -7, y: 0, width: 14, height: h, rx: 6, fill: COL.task, 'fill-opacity': .85, stroke: COL.board, 'stroke-width': 1.5 }, g);
  return g;
};
// A tie around a bundle centred at cx (hidden until shown).
const c01_tie = (p, cx, y) => {
  const g = G(p, { o: 0, s: 1 });
  mk('rect', { x: cx - 62, y, width: 124, height: 20, rx: 6, fill: COL.task }, g);
  return g;
};
// Number line 0…20: x of 0, pixels per unit, the line's y.
const NL = { o: 150, u: 65, y: 560 };
const c01_X = v => NL.o + NL.u * v;
function c01_line(p, t0, { y = NL.y, labels = true } = {}) {
  const g = G(p, { o: 0 });
  path(g, `M${c01_X(0) - 30} ${y}H${c01_X(20) + 40}`, { stroke: COL.chalk, 'stroke-width': 3 });
  path(g, `M${c01_X(20) + 26} ${y - 10}L${c01_X(20) + 42} ${y}L${c01_X(20) + 26} ${y + 10}`, { stroke: COL.chalk, 'stroke-width': 3 });
  for (let v = 0; v <= 20; v++) {
    path(g, `M${c01_X(v)} ${y - (v % 5 ? 9 : 14)}v${v % 5 ? 18 : 28}`, { stroke: COL.chalk, 'stroke-width': v % 5 ? 2 : 3 });
    if (labels) T(g, String(v), { x: c01_X(v), y: y + 48, size: 24, fill: COL.dim, font: MATH, anchor: 'middle' });
  }
  show(g, t0, .6);
  return g;
}
// A round number chip centred on its group origin.
const c01_chip = (p, n, x, y, colr = COL.whole, r = 28) => {
  const g = G(p, { x, y, o: 0 });
  mk('circle', { r, fill: colr, 'fill-opacity': .22, stroke: colr, 'stroke-width': 3 }, g);
  T(g, String(n), { y: 10, size: 28, fill: COL.chalk, weight: 700, anchor: 'middle', font: MATH });
  return g;
};
// A ten-frame: 2 rows × 5 cells of size c from (x, y). Returns { g, at(i) -> [cx, cy] } (cells fill row by row).
const CELL = 80;
function c01_frame(p, x, y, t0) {
  const g = G(p, { o: 0 });
  for (let r = 0; r < 2; r++) for (let c = 0; c < 5; c++)
    mk('rect', { x: x + c * CELL, y: y + r * CELL, width: CELL, height: CELL, fill: 'none', stroke: COL.dim, 'stroke-width': 2.5 }, g);
  mk('rect', { x, y, width: 5 * CELL, height: 2 * CELL, fill: 'none', stroke: COL.chalk, 'stroke-width': 3.5 }, g);
  show(g, t0, .5);
  return { g, at: i => [x + (i % 5) * CELL + CELL / 2, y + Math.floor(i / 5) * CELL + CELL / 2] };
}
const c01_counter = (p, cx, cy, colr) => {
  const g = G(p, { x: cx, y: cy, o: 0 });
  mk('circle', { r: 30, fill: colr, 'fill-opacity': .85, stroke: COL.board, 'stroke-width': 2 }, g);
  return g;
};
// A house of a number (as in the workbook): roof with the number, rows of two cells.
function c01_house(p, cx, y, n, rows, t0, { w = 120, rh = 62, t = () => t0 } = {}) {
  const g = G(p, { o: 0 });
  path(g, `M${cx - w - 30} ${y}L${cx} ${y - 90}L${cx + w + 30} ${y}Z`, { fill: COL.task, 'fill-opacity': .25, stroke: COL.task, 'stroke-width': 3 });
  T(g, String(n), { x: cx, y: y - 22, size: 44, fill: COL.task, weight: 700, anchor: 'middle', font: MATH });
  rows.forEach((_, r) => {
    for (let k = 0; k < 2; k++) mk('rect', { x: cx - w + k * w, y: y + r * rh, width: w, height: rh, fill: 'none', stroke: COL.chalk, 'stroke-width': 2.5 }, g);
  });
  show(g, t0, .5);
  rows.forEach(([a, b], r) => {
    [[a, COL.whole], [b, COL.int]].forEach(([v, colr], k) => {
      const e = T(p, String(v), { x: cx - w / 2 + k * w, y: y + r * rh + 44, size: 36, fill: v === '?' ? COL.task : colr, weight: 700, anchor: 'middle', font: MATH, o: 0 });
      show(e, t(r));
    });
  });
  return g;
}

const CMP = [['lt', '<', null, '<'], ['eq', '=', null, '='], ['gt', '>', null, '>']];

/* ---------- beats ---------- */
const BEATS = [
  ['intro', 'Числа от 1 до 20', (m, D) => {
    const g = G(scene, { o: 0, y: 24 });
    T(g, 'Раздел 1 · Глава 1', { x: 800, y: 330, size: 28, fill: COL.dim, anchor: 'middle' });
    T(g, 'Числа от 1 до 20', { x: 800, y: 440, size: 96, weight: 600, anchor: 'middle' });
    tw(g, { o: 1, y: 0 }, .2, 1.1, out);
    const r = text(scene, 'считаем, сравниваем, складываем и вычитаем', 800, 600, m('sub'), { size: 34, fill: COL.dim, anchor: 'middle' });
    tw(g, { o: 0, y: -24 }, D - .9, .8); hide(r, D - .9, .8);
  }],

  ['teen', 'Десяток и единицы', (m) => {
    const p = panel(0);
    const top = 210;
    // the first ten sticks, spread out, then squeezed into a bundle
    const A = Array.from({ length: 10 }, (_, i) => c01_stick(p, 450 + i * 22, top));
    A.forEach((s, i) => show(s, .2 + i * .08, .3));
    A.forEach((s, i) => tw(s, { x: 495 + i * 11 }, m('tie'), .6));
    A.forEach(s => tw(s.firstChild, { c_fill: COL.whole }, m('tie', .3), .5));   // a tied ten turns blue
    const tie1 = c01_tie(p, 545, top + 90);
    show(tie1, m('tie', .6), .3);
    text(p, '1 десяток', 545, top + 270, m('tie', .8), { size: 32, fill: COL.whole, anchor: 'middle', weight: 700 });
    // loose sticks
    const L = Array.from({ length: 10 }, (_, i) => c01_stick(p, 810 + i * 40, top));
    [0, 1, 2, 3].forEach(i => show(L[i], m('four', i * .2), .3));
    const ones = text(p, '4 единицы', 870, top + 270, m('four', .9), { size: 32, fill: COL.task, anchor: 'middle', weight: 700 });
    const f14 = mline(p, '14 = 10 + 4', 800, 700, m('n14'), COL.chalk, 72);
    [4, 5, 6].forEach((i, k) => show(L[i], m('more', k * .25), .3));
    hide(f14, m('n17'), .3); hide(ones, m('n17'), .3);
    const ones7 = text(p, '7 единиц', 930, top + 270, m('n17'), { size: 32, fill: COL.task, anchor: 'middle', weight: 700 });
    const f17 = mline(p, '17 = 10 + 7', 800, 700, m('n17', .2), COL.chalk, 72);
    [7, 8, 9].forEach((i, k) => show(L[i], m('ten', k * .25), .3));
    hide(f17, m('tie2'), .3); hide(ones7, m('tie2'), .3);
    L.forEach((s, i) => tw(s, { x: 945 + i * 11 }, m('tie2'), .6));
    L.forEach(s => tw(s.firstChild, { c_fill: COL.whole }, m('tie2', .3), .5));
    const tie2 = c01_tie(p, 995, top + 90);
    show(tie2, m('tie2', .6), .3);
    text(p, '1 десяток', 995, top + 270, m('tie2', .8), { size: 32, fill: COL.whole, anchor: 'middle', weight: 700 });
    mline(p, '20 = 10 + 10', 800, 700, m('n20'), COL.chalk, 72);
    text(p, 'два десятка', 800, 780, m('n20', .4), { size: 34, fill: COL.whole, anchor: 'middle', weight: 600 });
  }],

  ['line', 'Числовой луч', (m) => {
    const p = panel(0);
    const nums = [19, 15, 8, 3, 17, 1, 20, 6, 12];
    const chips = nums.map((n, i) => {
      const c = c01_chip(p, n, 250 + i * 138, 190 + (i % 2) * 70);
      show(c, .2 + i * .06, .3);
      return c;
    });
    c01_line(p, .6);
    [...nums].sort((a, b) => a - b).forEach((n, k) => {
      tw(chips[nums.indexOf(n)], { x: c01_X(n), y: NL.y - 60 }, m('sort', k * .3), .7);
    });
    const arr = path(p, `M${c01_X(2)} 680H${c01_X(18)}M${c01_X(18) - 18} 668L${c01_X(18)} 680L${c01_X(18) - 18} 692`, { stroke: COL.good, 'stroke-width': 4 }, { d: 0 });
    draw(arr, m('grow'), 1.2);
    text(p, 'больше', c01_X(18) + 20, 690, m('grow', .9), { size: 30, fill: COL.good, weight: 600 });
    const q = T(p, '?', { x: c01_X(18), y: NL.y - 50, size: 48, fill: COL.task, anchor: 'middle', weight: 700, o: 0 });
    show(q, m('between'), .3);
    pulse(chips[nums.indexOf(17)], m('between', .6), 1.25); pulse(chips[nums.indexOf(19)], m('between', 1.4), 1.25);
    hide(q, m('n18'), .2);
    const c18 = c01_chip(p, 18, c01_X(18), NL.y - 60, COL.good);
    put(c18, { s: .4 }); pop(c18, m('n18'));
    pulse(chips[nums.indexOf(15)], m('cmp'), 1.25); pulse(c18, m('cmp', .4), 1.25);
    mline(p, '15 < 18', 800, 790, m('cmp', 1), COL.chalk, 64);
  }],

  ['q1', 'Проверь себя', () => {
    const p = panel(0);
    c01_line(p, .1, { y: 95 });
  }, { ask: done => quiz({ x: 220, y: 170, w: 1160, cls: 'side' }, [{
    id: 'c-compare', prompt: ['Какой знак поставить: <, = или >?'],
    build: grid([
      { parts: ['15  ○  18'], ans: ['lt'], why: '15 стоит в ряду раньше, чем 18.' },
      { parts: ['12  ○  10'], ans: ['gt'], why: '12 — это десяток и ещё 2, больше десяти.' },
      { parts: ['16  ○  17'], ans: ['lt'], why: '17 идёт сразу за 16, значит, 16 меньше.' },
      { parts: ['8  ○  18'], ans: ['lt'], why: '18 — это десяток и 8. Это больше, чем просто 8.' },
      { parts: ['20  ○  19'], ans: ['gt'], why: '20 идёт сразу после 19.' },
    ], CMP, { multi: false, text: true }),
  }, {
    id: 'c-neighbours', prompt: ['Найди соседей на числовом луче.'],
    build: blanks([
      { parts: ['Между 18 и 20 стоит число ', { box: '19' }], why: 'При счёте: 18, 19, 20.', hint: 'Посчитай вслух от 18 до 20.' },
      { parts: ['Между 8 и 10 стоит число ', { box: '9' }], why: 'При счёте: 8, 9, 10.', hint: 'Посчитай вслух от 8 до 10.' },
      { parts: ['Сразу за 19 идёт ', { box: '20' }], why: '19 + 1 = 20.', hint: 'Прибавь к 19 один.' },
      { parts: ['Перед 13 называют ', { box: '12' }], why: '13 − 1 = 12.', hint: 'Отними от 13 один.' },
    ]),
  }], done) }],

  ['compose', 'Состав числа 10', (m) => {
    const p = panel(0);
    const cx = i => 440 + i * 80, cy = 200;
    const dots = Array.from({ length: 10 }, (_, i) => {
      const c = mk('circle', { cx: cx(i), cy, r: 30, fill: COL.whole, 'fill-opacity': .85, stroke: COL.board, 'stroke-width': 2 }, p);
      put(c, { o: 0 }); show(c, .2 + i * .05, .3);
      return c;
    });
    const div = G(p, { x: 400 + 9 * 80, o: 0 });
    path(div, 'M0 150V250', { stroke: COL.task, 'stroke-width': 5 });
    tw(dots[9], { c_fill: COL.int }, m('r1'), .3);
    show(div, m('r1'), .3);
    const pairs = [[9, 1], [8, 2], [7, 3], [6, 4], [5, 5]];
    pairs.forEach(([a], r) => {
      if (r) { tw(dots[a], { c_fill: COL.int }, m('r' + (r + 1)), .3); tw(div, { x: 400 + a * 80 }, m('r' + (r + 1)), .4); }
    });
    c01_house(p, 800, 430, 10, pairs, m('r1'), { t: r => m('r' + (r + 1), .3) });
    const h = path(p, 'M1000 450H1080M1000 450L1020 438M1000 450L1020 462', { stroke: COL.faint, 'stroke-width': 3 });
    put(h, { o: 0 }); show(h, m('use'));
    text(p, 'домик числа 10', 1100, 460, m('use'), { size: 30, fill: COL.dim });
  }],

  ['q2', 'Проверь себя', () => {
    const p = panel(0);
    c01_house(p, 300, 280, 11, [['?', 5], [7, '?'], ['?', 3], [9, '?'], ['?', 1]], .2);
  }, { ask: done => quiz({ x: 620, y: 100, w: 900, cls: 'side' }, [{
    id: 'c-house', prompt: ['Засели домик: какие числа вместе составляют 11?'],
    build: blanks([
      { parts: ['11 = ', { box: '6' }, ' + 5'], why: '6 + 5 = 11.', hint: 'Сколько не хватает пяти до одиннадцати?' },
      { parts: ['11 = 7 + ', { box: '4' }], why: '7 + 4 = 11: 7 + 3 = 10, и ещё 1.', hint: 'Дополни 7 до десяти, а потом ещё до одиннадцати.' },
      { parts: ['11 = ', { box: '8' }, ' + 3'], why: '8 + 3 = 11.', hint: 'Что нужно прибавить к трём, чтобы получить 11?' },
      { parts: ['11 = 9 + ', { box: '2' }], why: '9 + 2 = 11: 9 + 1 = 10, и ещё 1.', hint: 'Сколько от 9 до 11?' },
      { parts: ['11 = ', { box: '10' }, ' + 1'], why: '11 — это десяток и одна единица.', hint: '11 — это десяток и …' },
    ]),
  }], done) }],

  ['cross', 'Сложение через десяток', (m) => {
    const p = panel(0);
    const A = c01_frame(p, 300, 150, .2), B = c01_frame(p, 900, 150, .2);
    for (let i = 0; i < 8; i++) { const [x, y] = A.at(i); show(c01_counter(p, x, y, COL.whole), m('eight', i * .08), .3); }
    const or = Array.from({ length: 6 }, (_, i) => { const c = c01_counter(p, 600 + i * 80, 430, COL.task); show(c, m('six', i * .1), .3); return c; });
    // the two empty places
    const gap = G(p, { o: 0 });
    [8, 9].forEach(i => { const [x, y] = A.at(i); mk('circle', { cx: x, cy: y, r: 30, fill: 'none', stroke: COL.task, 'stroke-width': 3, 'stroke-dasharray': '6 6' }, gap); });
    show(gap, m('need'), .4);
    // the example with its split
    const big = { size: 64, fill: COL.chalk, anchor: 'middle', font: MATH, o: 0 };
    const ex = G(p, { o: 0 });
    T(ex, '8', { ...big, x: 560, y: 640, o: 1 }); T(ex, '+', { ...big, x: 620, y: 640, o: 1 }); T(ex, '6', { ...big, x: 680, y: 640, o: 1 });
    show(ex, .4, .4);
    draw(path(p, 'M670 660L640 700M690 660L720 700', { stroke: COL.task, 'stroke-width': 3 }, { d: 0 }), m('split'), .4);
    const s2 = T(p, '2', { ...big, size: 46, x: 630, y: 745, fill: COL.task }); show(s2, m('split', .4), .3);
    const s4 = T(p, '4', { ...big, size: 46, x: 730, y: 745, fill: COL.task }); show(s4, m('split', .7), .3);
    // two counters fill the ten, four go on
    [0, 1].forEach(k => { const [x, y] = A.at(8 + k); tw(or[k], { x, y }, m('two', k * .2), .6); });
    hide(gap, m('two', .6), .3);
    const lab10 = text(p, '10', 500, 130, m('two', 1), { size: 40, fill: COL.good, anchor: 'middle', weight: 700 });
    pulse(lab10, m('two', 1.2), 1.3);
    mline(p, '8 + 2 = 10', 900, 660, m('two', .8), COL.chalk, 50, 'start');
    [2, 3, 4, 5].forEach((k, j) => { const [x, y] = B.at(j); tw(or[k], { x, y }, m('four', j * .15), .6); });
    mline(p, '10 + 4 = 14', 900, 750, m('ans'), COL.chalk, 50, 'start');
    show(T(p, '= 14', { ...big, x: 790, y: 640, fill: COL.good, weight: 700 }), m('ans', .6), .4);
  }],

  ['q3', 'Проверь себя', () => {
    const p = panel(0);
    text(p, 'Помни:', 120, 220, .2, { size: 30, fill: COL.dim });
    mline(p, '8 + 6 = 8 + 2 + 4', 120, 300, .3, COL.chalk, 44, 'start');
    mline(p, '= 10 + 4 = 14', 222, 370, .4, COL.chalk, 44, 'start');
  }, { ask: done => quiz({ x: 640, y: 120, w: 880, cls: 'side' }, [{
    id: 'c-plus', prompt: ['Прибавь через десяток: сначала дополни до 10.'],
    build: blanks([
      { parts: ['9 + 7 = 9 + 1 + ', { box: '6' }, ' = ', { box: '16' }], why: '7 — это 1 и 6. 9 + 1 = 10, 10 + 6 = 16.', hint: 'Девяти до десяти не хватает одного. Сколько останется от семи?' },
      { parts: ['7 + 4 = 7 + 3 + ', { box: '1' }, ' = ', { box: '11' }], why: '4 — это 3 и 1. 7 + 3 = 10, 10 + 1 = 11.', hint: 'Семи до десяти не хватает трёх. Сколько останется от четырёх?' },
      { parts: ['6 + 8 = 6 + 4 + ', { box: '4' }, ' = ', { box: '14' }], why: '8 — это 4 и 4. 6 + 4 = 10, 10 + 4 = 14.', hint: 'Шести до десяти не хватает четырёх. Сколько останется от восьми?' },
    ]),
  }], done) }],

  ['minus', 'Вычитание через десяток', (m) => {
    const p = panel(0);
    const A = c01_frame(p, 300, 150, .2), B = c01_frame(p, 900, 150, .2);
    const cA = Array.from({ length: 10 }, (_, i) => { const [x, y] = A.at(i); const c = c01_counter(p, x, y, COL.whole); show(c, .3 + i * .04, .3); return c; });
    const cB = [0, 1].map(i => { const [x, y] = B.at(i); const c = c01_counter(p, x, y, COL.whole); show(c, .8 + i * .1, .3); return c; });
    pulse(B.g, m('twelve', 1.5), 1.03);
    const big = { size: 64, fill: COL.chalk, anchor: 'middle', font: MATH, o: 0 };
    const ex = G(p, { o: 0 });
    T(ex, '12', { ...big, x: 545, y: 640, o: 1 }); T(ex, '−', { ...big, x: 620, y: 640, o: 1 }); T(ex, '4', { ...big, x: 680, y: 640, o: 1 });
    show(ex, .4, .4);
    draw(path(p, 'M670 660L640 700M690 660L720 700', { stroke: COL.task, 'stroke-width': 3 }, { d: 0 }), m('split'), .4);
    const s1 = T(p, '2', { ...big, size: 46, x: 630, y: 745, fill: COL.task }); show(s1, m('split', .4), .3);
    const s2 = T(p, '2', { ...big, size: 46, x: 730, y: 745, fill: COL.task }); show(s2, m('split', .7), .3);
    // take away: a removed counter fades and gets a cross
    const away = (c, t0) => {
      tw(c, { o: .18 }, t0, .4);
      const [x, y] = [st(c).x, st(c).y];
      draw(path(p, `M${x - 22} ${y - 22}L${x + 22} ${y + 22}M${x + 22} ${y - 22}L${x - 22} ${y + 22}`, { stroke: COL.task, 'stroke-width': 4 }, { d: 0 }), t0 + .2, .3);
    };
    cB.forEach((c, k) => away(c, m('first', k * .3)));
    mline(p, '12 − 2 = 10', 900, 660, m('first', 1), COL.chalk, 50, 'start');
    // the mistake: stopping after the first part
    const wrong = G(p, { o: 0 });
    M(wrong, ['12 − 4 = 10'], { x: 1250, y: 780, size: 44, fill: COL.bad });
    show(wrong, m('wrong'));
    draw(path(wrong, 'M1120 768L1380 754', { stroke: COL.bad, 'stroke-width': 5 }, { d: 0 }), m('wrong', 2.6), .4);
    hide(wrong, m('second'), .4);
    [9, 8].forEach((i, k) => away(cA[i], m('second', k * .3)));
    mline(p, '10 − 2 = 8', 900, 750, m('ans'), COL.chalk, 50, 'start');
    show(T(p, '= 8', { ...big, x: 780, y: 640, fill: COL.good, weight: 700 }), m('ans', .6), .4);
  }],

  ['q4', 'Проверь себя', () => {
    const p = panel(0);
    text(p, 'Помни:', 120, 220, .2, { size: 30, fill: COL.dim });
    mline(p, '12 − 4 = 12 − 2 − 2', 120, 300, .3, COL.chalk, 44, 'start');
    mline(p, '= 10 − 2 = 8', 252, 370, .4, COL.chalk, 44, 'start');
  }, { ask: done => quiz({ x: 640, y: 120, w: 880, cls: 'side' }, [{
    id: 'c-minus', prompt: ['Вычти через десяток: сначала дойди до 10.'],
    build: blanks([
      { parts: ['13 − 5 = 13 − 3 − ', { box: '2' }, ' = ', { box: '8' }], why: '5 — это 3 и 2. 13 − 3 = 10, 10 − 2 = 8.', hint: 'От 13 до 10 отнимаем 3. Сколько ещё осталось отнять от пяти?' },
      { parts: ['11 − 6 = 11 − 1 − ', { box: '5' }, ' = ', { box: '5' }], why: '6 — это 1 и 5. 11 − 1 = 10, 10 − 5 = 5.', hint: 'От 11 до 10 отнимаем 1. Сколько ещё осталось отнять от шести?' },
      { parts: ['14 − 8 = 14 − 4 − ', { box: '4' }, ' = ', { box: '6' }], why: '8 — это 4 и 4. 14 − 4 = 10, 10 − 4 = 6.', hint: 'От 14 до 10 отнимаем 4. Сколько ещё осталось отнять от восьми?' },
    ]),
  }], done) }],

  ['wrap', 'Главное', (m) => {
    const p = panel(0);
    text(p, 'Запомним главное', 200, 170, .2, { size: 40, fill: COL.dim, weight: 600 });
    [['Число второго десятка — это десяток и единицы: 14 = 10 + 4.', 'w1', false],
     ['Чем правее число в ряду, тем оно больше.', 'w2', false],
     ['8 + 6 = 8 + 2 + 4 = 14', 'w3', true],
     ['12 − 4 = 12 − 2 − 2 = 8', 'w4', true]].forEach(([str, mark, big], i) => {
      const g = G(p, { x: -16, y: 290 + i * 130, o: 0 });
      mk('circle', { cx: 200, cy: -12, r: 26, fill: COL.task }, g);
      T(g, String(i + 1), { x: 200, y: -1, size: 30, fill: COL.board, weight: 700, anchor: 'middle' });
      T(g, str, { x: 260, size: big ? 44 : 34, weight: 600, font: big ? MATH : UI });
      tw(g, { o: 1, x: 0 }, m(mark), .6);
    });
  }],

  ['final1', 'Итоговое задание', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-compare', prompt: ['Сначала вычисли, потом сравни: <, = или >?'],
    build: grid([
      { parts: ['6 + 5  ○  10'], ans: ['gt'], why: '6 + 5 = 11, а 11 больше 10. Не смотри только на 6!' },
      { parts: ['9 + 1  ○  11'], ans: ['lt'], why: '9 + 1 = 10, а 10 меньше 11.' },
      { parts: ['4 + 9  ○  13'], ans: ['eq'], why: '4 + 9 = 13.' },
      { parts: ['10 − 2  ○  9'], ans: ['lt'], why: '10 − 2 = 8, а 8 меньше 9.' },
      { parts: ['13 − 6  ○  7'], ans: ['eq'], why: '13 − 3 − 3 = 7.' },
      { parts: ['16 − 9  ○  6'], ans: ['gt'], why: '16 − 6 − 3 = 7, а 7 больше 6.' },
    ], CMP, { multi: false, text: true }),
  }], done, 'Итоговое задание   1 из 2') }],

  ['final2', 'Итоговое задание', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-cinema', prompt: ['В первом ряду кинотеатра заняли 8 мест, а во втором — на 2 места больше. Сколько мест заняли в двух рядах вместе?'],
    build: choice([['18 мест'], ['10 мест'], ['14 мест']], 0,
      'Во втором ряду 8 + 2 = 10 мест. В двух рядах 8 + 10 = 18 мест.',
      [null, '10 мест — это только второй ряд. Прибавь ещё первый: 8 + 10.',
       '«На 2 больше» — значит, прибавляем: во втором ряду 8 + 2 = 10, а не 6.']),
  }], done, 'Итоговое задание   2 из 2') }],

  ['finish', 'Готово', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

boot();
</script>
